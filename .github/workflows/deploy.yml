name: النشر على Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: التحقق من الأسرار
        run: |
          missing=""
          [ -z "$CLOUDFLARE_API_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -z "${{ secrets.ADMIN_PASSWORD }}" ] && missing="$missing ADMIN_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::أضف هذه الأسرار في Settings > Secrets and variables > Actions:$missing"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: تثبيت الحزم
        run: npm ci

      - name: فحص الأنواع
        run: npm run lint

      - name: بناء الواجهة
        run: npm run build

      - name: تجهيز قاعدة البيانات (تُنشأ تلقائياً أول مرة)
        run: |
          DB_ID=$(npx wrangler d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const db=JSON.parse(s).find(d=>d.name==='kalimati');process.stdout.write(db?db.uuid:'')})")
          if [ -z "$DB_ID" ]; then
            echo "إنشاء قاعدة البيانات kalimati..."
            npx wrangler d1 create kalimati
            DB_ID=$(npx wrangler d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const db=JSON.parse(s).find(d=>d.name==='kalimati');process.stdout.write(db?db.uuid:'')})")
          fi
          [ -z "$DB_ID" ] && { echo "::error::تعذّر الحصول على معرّف قاعدة البيانات"; exit 1; }
          sed -i "s/00000000-0000-0000-0000-000000000000/$DB_ID/" wrangler.jsonc
          npx wrangler d1 migrations apply kalimati --remote

      - name: النشر
        run: npx wrangler deploy

      - name: ضبط كلمة مرور الكاتب
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          node -e "require('fs').writeFileSync(process.env.RUNNER_TEMP + '/secrets.json', JSON.stringify({ ADMIN_PASSWORD: process.env.ADMIN_PASSWORD }))"
          npx wrangler secret bulk "$RUNNER_TEMP/secrets.json"
          rm -f "$RUNNER_TEMP/secrets.json"
