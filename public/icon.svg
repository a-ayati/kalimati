<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a241a" />
      <stop offset="100%" stop-color="#0e0f11" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbd38d" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
  <!-- Double ornamental border -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.6" />
  <rect x="36" y="36" width="440" height="440" rx="84" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" stroke-opacity="0.4" stroke-dasharray="6,4" />
  <!-- Corner arabesque accents -->
  <circle cx="50" cy="50" r="4" fill="#d97706" />
  <circle cx="462" cy="50" r="4" fill="#d97706" />
  <circle cx="50" cy="462" r="4" fill="#d97706" />
  <circle cx="462" cy="462" r="4" fill="#d97706" />
  <!-- Central Emblem: Elegant Arabic Kaf & Nib Silhouette -->
  <g transform="translate(256, 230) scale(1.15)">
    <!-- Feather / Pen Nib -->
    <path d="M0 -110 C25 -70 42 -20 40 40 C38 65 15 85 0 95 C-15 85 -38 65 -40 40 C-42 -20 -25 -70 0 -110 Z" fill="url(#goldGrad)" />
    <!-- Slit and heart eye of the calligraphy nib -->
    <line x1="0" y1="-85" x2="0" y2="20" stroke="#0e0f11" stroke-width="4" stroke-linecap="round" />
    <circle cx="0" cy="20" r="8" fill="#0e0f11" />
    <!-- Red Tashkeel accent (Fusha heritage) -->
    <circle cx="-50" cy="-60" r="10" fill="#e05252" />
    <path d="M-58 -80 C-46 -75 -44 -65 -50 -55" stroke="#e05252" stroke-width="4" fill="none" stroke-linecap="round" />
    <!-- Yellow Tashkeel accent (Algerian Darja heritage) -->
    <circle cx="52" cy="-55" r="9" fill="#f59e0b" />
    <!-- Calligraphic flourish below -->
    <path d="M-90 100 C-30 140 30 140 90 100 C50 120 -50 120 -90 100 Z" fill="url(#goldGrad)" opacity="0.8" />
  </g>
  <!-- App text in Arabic -->
  <text x="256" y="420" font-family="'Amiri', 'Traditional Arabic', serif" font-size="52" font-weight="bold" fill="#f7fafc" text-anchor="middle" letter-spacing="2">كَلِمَاتِي</text>
  <text x="256" y="452" font-family="'Cairo', sans-serif" font-size="19" fill="#d97706" text-anchor="middle" letter-spacing="1">كَلِمَةٌ تَصِلُ فِي وَقْتِهَا</text>
</svg>
